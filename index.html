<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Focus Mode</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #input-area { text-align: center; width: 85%; max-width: 500px; }
        textarea { width: 100%; padding: 15px; border-radius: 15px; background: #222; color: white; border: 2px solid #444; font-size: 18px; box-sizing: border-box; outline: none; resize: none; }
        button { margin-top: 15px; padding: 20px; width: 100%; border-radius: 15px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: opacity 0.2s; }
        button:active { opacity: 0.7; }
        #start-btn { background-color: #007aff; color: white; }
        
        #current { font-size: 14vw; font-weight: 900; text-align: center; padding: 20px; line-height: 1.1; display: none; text-transform: capitalize; word-wrap: break-word; max-width: 90%; }
        
        #controls { display: none; position: fixed; bottom: 30px; width: 90%; max-width: 500px; gap: 8px; }
        #back { background-color: #444; flex: 1; height: 70px; color: white; }
        #edit { background-color: #666; flex: 1; height: 70px; color: white; }
        #done { background-color: #34c759; flex: 2; height: 70px; color: white; }
    </style>
</head>
<body>

    <div id="input-area">
        <h2 style="color:#007aff">Focus Mode</h2>
        <textarea id="tasks" rows="8" placeholder="Task 1, Task 2, Task 3..."></textarea>
        <button id="start-btn">START FOCUS</button>
    </div>

    <div id="current"></div>

    <div id="controls">
        <button id="back">BACK</button>
        <button id="edit">EDIT</button>
        <button id="done">DONE</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const startBtn = document.getElementById('start-btn');
            const doneBtn = document.getElementById('done');
            const backBtn = document.getElementById('back');
            const editBtn = document.getElementById('edit');
            const inputArea = document.getElementById('input-area');
            const currentDiv = document.getElementById('current');
            const controls = document.getElementById('controls');
            const textarea = document.getElementById('tasks');
            
            let taskList = [];
            let index = 0;

            // 1. LOAD SAVED DATA ON STARTUP
            const savedTasks = localStorage.getItem('focusModeTasks');
            if (savedTasks) {
                textarea.value = savedTasks;
            }

            // Load the list and hide the input
            startBtn.addEventListener('click', function() {
                const rawText = textarea.value;
                
                // 2. SAVE TO LOCAL STORAGE
                localStorage.setItem('focusModeTasks', rawText);

                taskList = rawText.split(/[,\n;.|\t]+/).map(t => t.trim()).filter(t => t.length > 0);

                if (taskList.length > 0) {
                    index = 0;
                    inputArea.style.display = 'none';
                    currentDiv.style.display = 'block';
                    controls.style.display = 'flex';
                    render();
                }
            });

            editBtn.addEventListener('click', function() {
                inputArea.style.display = 'block';
                currentDiv.style.display = 'none';
                controls.style.display = 'none';
            });

            function render() {
                if (index < taskList.length) {
                    currentDiv.innerText = taskList[index];
                    backBtn.style.visibility = (index > 0) ? 'visible' : 'hidden';
                } else {
                    currentDiv.innerText = "✓ ALL DONE";
                    controls.style.display = 'none';
                    // Optional: Clear storage once complete if you want a fresh start next time
                    // localStorage.removeItem('focusModeTasks'); 
                    setTimeout(() => location.reload(), 1500);
                }
            }

            doneBtn.addEventListener('click', function() { index++; render(); });
            backBtn.addEventListener('click', function() { if (index > 0) { index--; render(); } });
        });
    </script>
</body>
</html>
